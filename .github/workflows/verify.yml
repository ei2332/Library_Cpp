name: Verify libraries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test print HTML and parser compatibility
        run: python -m unittest discover -s tests -p 'test_print_html.py'
      - name: Install online-judge-tools
        run: python -m pip install setuptools online-judge-tools
      - name: Verify URLs and test cases
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/verify.py

  build_html:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build printable HTML and library index
        run: python scripts/build_site.py --output dist
      - name: Upload printable HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-print-html
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish_html:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, build_html]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download generated HTML
        uses: actions/download-artifact@v4
        with:
          name: library-print-html
          path: dist
      - name: Push generated HTML to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach site origin/gh-pages
            git -C site switch -C gh-pages
          else
            git worktree add --detach site HEAD
            git -C site switch --orphan gh-pages
          fi

          rsync -a --delete --exclude='.git' dist/ site/
          touch site/.nojekyll
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git -C site commit -m "Update generated HTML from $GITHUB_SHA"
          git -C site push origin HEAD:gh-pages
